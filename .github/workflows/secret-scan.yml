name: Secret scan

# The backstop behind .githooks/pre-commit.
#
# The hook can be skipped — a bypass flag, a fresh clone that never ran
# `npm install`, a commit made from a web UI. This cannot. It also scans full
# history rather than one diff, which is what catches a key that went in months
# ago and has been sitting there since; that is exactly how the Braintree and
# Elasticsearch keys in the legacy app went unnoticed until an audit found them.

on:
  push:
  pull_request:
  schedule:
    # Weekly, because a leak that lands between pushes should not wait for the
    # next one to be found, and rules get added to gitleaks over time.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the default shallow clone would only ever scan the tip,
          # which misses every secret that was committed and later deleted — the
          # ones that still work.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required when the repository belongs to a GitHub organisation.
          # Personal repositories run without it; leaving it unset is harmless.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
