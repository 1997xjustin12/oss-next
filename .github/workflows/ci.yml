name: Checks

# The gate for the git flow (CONTRIBUTING.md). The repository cannot enforce
# branch protection on its plan, so this is what tells a PR author that a
# change is safe to merge: types, lint and the unit tests, on every PR into
# develop or the deployed branch, and on every push to those two.
#
# Not `next build`: it needs the backend and search credentials, which this
# repository's Actions do not hold. Run `npm run build` locally before a
# release (the release checklist in CONTRIBUTING.md).

on:
  pull_request:
    branches: [develop, integrate-wp-render]
  push:
    branches: [develop, integrate-wp-render]

permissions:
  contents: read

# A newer push to the same PR replaces the run in progress.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commits, as in secret-scan.yml; the version is in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
